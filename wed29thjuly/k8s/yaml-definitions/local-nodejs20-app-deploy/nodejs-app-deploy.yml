apiVersion: apps/v1
kind: Deployment

metadata:
  name: nodejs-app-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
        - name: nodejs-app
          image: monty97/tech610-tttapp:1.2.0

          ports:
            - containerPort: 3000
